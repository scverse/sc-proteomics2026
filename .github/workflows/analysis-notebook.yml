# Executes workstreams/ms-metrics/analysis.py and publishes the rendered notebook as an artifact, so
# a change to a metric can be reviewed by looking at what it did rather than at the diff alone.
#
# Nothing is committed back. The notebook is tracked as a jupytext py:percent script and the .ipynb
# is a build artifact, per workstreams/ms-metrics/.gitignore, and that stays true here.
name: Render analysis notebook

on:
  push:
    paths:
      - "workstreams/ms-metrics/**"
      - ".github/workflows/analysis-notebook.yml"
  pull_request:
    paths:
      - "workstreams/ms-metrics/**"
      - ".github/workflows/analysis-notebook.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: workstreams/ms-metrics
    env:
      MSMETRICS_DATA_DIR: ${{ github.workspace }}/.dataset-cache
      # Deliberately no MPLBACKEND here. ipykernel installs matplotlib-inline, which is what puts the
      # figures *into* the notebook; forcing Agg is headless-safe but silently renders a page with no
      # plots on it (one image instead of seven). Agg belongs in tests/conftest.py, not here.
      # analysis.py already defaults to a sweep sized for about ten minutes locally. A two-core
      # runner is several times slower than that, so trim the dose grid here as well -- the notebook
      # prints the parameters it used and says to read a reduced run for whether something moved
      # rather than for numbers worth quoting.
      #
      # Doses cost more than replicates: several of the wrapped metrics are jitted, and a dose that
      # changes the cell count (`subsample`) forces a recompile for that shape.
      MSMETRICS_N_REPLICATES: "3"
      MSMETRICS_NULL_REPLICATES: "10"
      MSMETRICS_DOSES: "0,0.5,1.0"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # Without this the cache has nothing to key on and is never invalidated, so a dependency
          # change would keep resolving against the stale one.
          cache-dependency-glob: workstreams/ms-metrics/pyproject.toml

      # Keyed on datasets.py because the download URL lives there, so changing it busts the cache.
      # A file that is not HDF5 is rejected and deleted by datasets.wu2025 rather than cached, so a
      # Google Drive error page cannot poison this.
      - name: Cache the wu2025 dataset
        uses: actions/cache@v4
        with:
          path: ${{ env.MSMETRICS_DATA_DIR }}
          key: wu2025-${{ hashFiles('workstreams/ms-metrics/msmetrics/datasets.py') }}

      - name: Install
        run: uv pip install --system -e '.[notebook]' nbconvert

      - name: Render
        run: |
          jupytext --to ipynb --output analysis.ipynb analysis.py
          # nbconvert 7 already defaults this to None, i.e. no per-cell limit -- pinned so a future
          # change of that default cannot start killing the sweep cell mid-render. The real ceiling
          # is this job's timeout-minutes.
          jupyter nbconvert --execute --to html --output analysis.html analysis.ipynb \
            --ExecutePreprocessor.timeout=1800

      - uses: actions/upload-artifact@v5
        with:
          name: analysis-notebook
          path: |
            workstreams/ms-metrics/analysis.html
            workstreams/ms-metrics/analysis.ipynb

      - name: Say where to find it
        run: |
          {
            echo "### Rendered analysis notebook"
            echo
            echo "Download the **analysis-notebook** artifact from this run and open \`analysis.html\`."
            echo
            echo "Rendered with a reduced sweep: ${MSMETRICS_N_REPLICATES} replicates, doses ${MSMETRICS_DOSES}."
            echo "Run \`analysis.py\` with no environment overrides for the full 30-replicate numbers."
          } >> "$GITHUB_STEP_SUMMARY"
