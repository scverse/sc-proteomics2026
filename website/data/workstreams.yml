# Each workstream appears as a card on the homepage.
# Remove all entries to hide the section.
# 'lead' is a GitHub username — their avatar is shown automatically.
- title: "Curation of Datasets"
  description: "Define criteria for high-quality benchmark datasets and establish a curated resource for evaluating and comparing computational methods"
  lead: "Florian Mutschler"

- title: "Cell Cycle Annotation"
  description: "Develop and benchmark methods to classify or infer cell-cycle states from single-cell proteomics data, including classification, pseudotime, and regression approaches"
  lead: "Anna Sophie Welter"

- title: "Cell Type Annotation"
  description: "We will investigate how individual choices within the annotation pipeline—such as dimensionality reduction, clustering resolution, and marker set selection—affect the final results. We will also evaluate how different annotation strategies, including marker-based, reference-based, and probabilistic approaches, influence cell type assignments"
  lead: "sarahszvetecz"

- title: "New Imputation Methods"
  description: "Develop a new statistical approach for handling missing values in multi-cell-type proteomics data, with a focus on identifying and modeling different types of missingness"
  lead: "Yasat Hacibaloglu"

- title: "Analysis Quality Metrics"
  description: "Establish consensus metrics and evaluation strategies to assess the quality and biological meaningfulness of preprocessing, normalization, imputation, and downstream analysis"
  lead: "lucas-diedrich"

- title: "Match Between Runs (MBR)"
  description: "Investigate how match-between-runs affects downstream single-cell proteomics analyses and develop practical guidance for its use, including whether bulk-proteomics approaches require adaptation for SCP"
  lead: "Sonja-Stockhaus"

- title: "scpdata Integration"
  description: "Expand the scpdata package with additional single-cell proteomics datasets and enable interoperability between R and other programming languages"
  lead: "lgatto"

- title: "Filtering & Batch Correction" 
  description: "Develop benchmarkable approaches for filtering and quality control, including methods to assess and improve batch-correction results"
  lead: "LOOKING FOR ONE"
