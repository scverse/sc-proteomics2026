[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "msmetrics"
description = "Metrics and methods for diagnosing and processing single-cell proteomics datasets"
readme = "README.md"
maintainers = [
  { name = "Vincenth Brennsteiner", email = "brennsteiner@biochem.mpg.de" },
]
authors = [
  { name = "MannLabs" },
]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dynamic = [ "version" ]

dependencies = [
  "alphapepttools",
  "anndata",
  "gdown",
  "igraph",
  "matplotlib",
  "numpy",
  "pandas",
  "platformdirs>=4.11.7",
  "scanpy",
  "scib-metrics",
  "scikit-learn",
  "scipy",
]
optional-dependencies.dev = [
  "pre-commit",
]
optional-dependencies.notebook = [
  "ipykernel",
  "ipywidgets",
  "jupytext",
  "plottable",
]
optional-dependencies.test = [
  "nbmake",
  "pytest",
]
urls.Source = "https://github.com/scverse/sc-proteomics2026"

[tool.hatch.version]
path = "msmetrics/__init__.py"

[tool.hatch.build.targets.wheel]
packages = [ "msmetrics" ]

# Notebooks live in git as py:percent scripts and are paired to a local .ipynb, so Jupyter keeps
# both in sync while only the diffable script is committed.
[tool.jupytext]
formats = "ipynb,py:percent"

[tool.ruff]
line-length = 120
extend-include = [ "*.ipynb" ]

format.docstring-code-format = true

lint.pydocstyle.convention = "numpy"

[tool.pytest.ini_options]
testpaths = [ "tests" ]
addopts = [
  "--import-mode=importlib",
]
